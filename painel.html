<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PresenX | Painel</title>

    <link rel="stylesheet" href="./css/painel.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <main class="painel-root">

        <!-- CABEÇALHO INSTITUCIONAL -->
        <header class="painel-header">

            <div class="painel-header-marca">

                <!-- Logo da escola (placeholder — trocar por <img> quando houver arquivo) -->
                <div class="painel-header-logo" aria-hidden="true">
                    CETEP
                </div>

                <div class="painel-header-textos">
                    <span class="painel-header-titulo">PresenX</span>

                    <span class="painel-header-instituicao">
                        <span class="nome-principal">CETEP</span>
                        <span class="nome-separador">/</span>
                        <span class="nome-unidade">LNAB</span>
                    </span>
                </div>

            </div>

            <div class="painel-header-datahora">
                <div id="painelData" class="painel-header-data">--/--/----</div>
                <div id="painelHoraAtual" class="painel-header-hora">--:--:--</div>
            </div>

        </header>

        <!-- FAIXA DE CONTEXTO -->
        <section class="painel-contexto">

            <div class="painel-contexto-esq">

                <span id="painelDia" class="painel-contexto-dia">
                    Segunda-feira
                </span>

                <span id="painelHorario" class="painel-chip">
                    1º horário
                </span>

                <span id="painelTurno" class="painel-chip">
                    Matutino
                </span>

            </div>

            <div class="painel-legenda">

                <div class="legenda-item">
                    <span class="legenda-cor verde"></span>
                    <span>Presente</span>
                </div>

                <div class="legenda-item">
                    <span class="legenda-cor vermelho"></span>
                    <span>Ausente</span>
                </div>

                <div class="legenda-item">
                    <span class="legenda-cor cinza"></span>
                    <span>Sem aula</span>
                </div>

            </div>

        </section>

        <!-- CORPO PRINCIPAL (70% turmas / 30% lateral) -->
        <section class="painel-corpo">

            <!-- ÁREA PRINCIPAL — exclusivamente a lista de turmas -->
            <section class="painel-grade-wrap">

                <div id="painelGrade" class="painel-grade"></div>

                <div id="painelVazio" class="painel-vazio" style="display:none;">
                    Nenhuma turma para exibir no momento
                </div>

            </section>

            <!-- LATERAL: Avisos da Gestão + Próximos Eventos -->
            <aside class="painel-lateral">

                <section class="painel-lateral-bloco">

                    <div class="painel-lateral-titulo">
                        <span class="painel-lateral-icone">📢</span>
                        <span>Avisos da Gestão</span>
                    </div>

                    <div id="painelAvisos" class="painel-lateral-lista">

                        <div class="painel-lateral-vazio">
                            Nenhum aviso no momento
                        </div>

                    </div>

                </section>

                <section class="painel-lateral-bloco">

                    <div class="painel-lateral-titulo">
                        <span class="painel-lateral-icone">🗓️</span>
                        <span>Próximos Eventos</span>
                    </div>

                    <div id="painelEventos" class="painel-lateral-lista">

                        <div class="painel-lateral-vazio">
                            Nenhum evento programado
                        </div>

                    </div>

                </section>

            </aside>

        </section>

        <!-- RODAPÉ -->
        <div class="painel-rodape">
            <span id="painelPagina">Página 1/1</span>
        </div>

    </main>

    <script src="./js/turnos.js"></script>

    <script src="./data/turmas_matutino.js"></script>
    <script src="./data/turmas_vespertino.js"></script>
    <script src="./data/turmas_noturno.js"></script>

    <!-- Firebase SDK (avisos em tempo real) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script>
      if (!firebase.apps.length) {
        firebase.initializeApp({
          apiKey: "Exemplo",
          authDomain: "Exemplo",
          databaseURL: "Exemplo",
          projectId: "Exemplo",
          storageBucket: "Exemplo",
          messagingSenderId: "Exemplo",
          appId: "Exemplo"
        });
      }
    </script>

    <script src="./js/painel.js"></script>

</body>
</html>
